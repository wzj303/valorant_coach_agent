<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALORANT 教练复盘</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <h1>VALORANT 教练复盘</h1>
    <div class="header-right">
      <span id="mode-badge" class="badge">连接中…</span>
      <span id="health-note" class="muted"></span>
    </div>
  </div>
</header>

<main>
  <section class="panel" id="input-panel">
    <h2>输入</h2>

    <div id="address-note" class="address-note muted" hidden></div>

    <div class="field">
      <label>任务类型</label>
      <div class="segmented" id="task-group">
        <button type="button" data-task="buy_review">购买复盘</button>
        <button type="button" data-task="position_review">站位复盘</button>
        <button type="button" data-task="match_review">整场复盘</button>
        <button type="button" data-task="">自动</button>
      </div>
    </div>

    <div class="field" id="match-controls" hidden>
      <label for="match-id">比赛编号（保留此编号可补传或恢复）</label>
      <input id="match-id" type="text" maxlength="64" placeholder="首次分析自动生成">
      <div class="sample-row">
        <button type="button" id="match-load">读取比赛进度</button>
        <button type="button" id="match-resume">继续中断的分析</button>
        <button type="button" id="match-new">新建比赛</button>
      </div>
      <label for="start-round">这批截图从第几回合开始</label>
      <input id="start-round" type="number" value="1" min="1" max="100">
      <p class="muted">每张截图对应一回合，按下方顺序分析，可用箭头调整。支持 13 局以上、加时和分批补传；请保持己方视角一致。仅凭开局图无法判断最后一局结果或回合内过程。</p>
      <label class="check"><input type="checkbox" id="replace-rounds"> 更正已上传回合（会重新分析该回合及后续回合）</label>
      <div id="match-progress" role="status" aria-live="polite" class="muted"></div>
    </div>

    <div class="field">
      <label for="text-input">问题或补充说明</label>
      <textarea id="text-input" rows="3"
        placeholder="例如：这回合该不该起枪？/ 站位有没有问题？"></textarea>
    </div>

    <div class="field">
      <label for="observation-input">已确认的事实（每行一条，视为 user_confirmed）</label>
      <textarea id="observation-input" rows="2"
        placeholder="例如：我方 Jett 有 4500 金币&#10;敌方开局连败两局"></textarea>
    </div>

    <div class="field">
      <label>截图（PNG / JPEG / WebP / GIF，单张 ≤ 20 MB；整场最多 100 回合，单次复盘最多 10 张）</label>
      <div id="drop-zone">
        <div class="drop-hint">点击选择文件，或把截图拖到这里</div>
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        <div id="previews" class="previews"></div>
      </div>
    </div>

    <details class="field" id="config-panel">
      <summary>模型配置（真实模型）</summary>
      <div class="config-grid">
        <div class="field">
          <label>接口格式</label>
          <select id="cfg-format">
            <option value="openai">OpenAI 兼容（chat/completions）</option>
            <option value="anthropic">Anthropic（/v1/messages）</option>
          </select>
        </div>
        <div class="field">
          <label>Base URL（留空使用官方默认地址）</label>
          <input type="text" id="cfg-base-url" placeholder="https://api.deepseek.com/v1">
        </div>
        <div class="field">
          <label>模型名（需支持图片输入和工具调用）</label>
          <input type="text" id="cfg-model" placeholder="例如 gpt-4o / deepseek-vl">
        </div>
        <div class="field">
          <label>API Key（保存后不回显；留空则保留服务器已有密钥）</label>
          <input type="password" id="cfg-key" placeholder="sk-..." autocomplete="off">
        </div>
      </div>
      <div class="sample-row">
        <button type="button" id="cfg-save">保存到服务器（全队共用）</button>
        <button type="button" id="cfg-test">测试连接（文字 / 看图 / 工具调用）</button>
      </div>
      <label class="check"><input type="checkbox" id="cfg-ephemeral"> 仅本次分析使用上面填写的配置（不保存到服务器）</label>
      <div id="cfg-note" class="muted note-line"></div>
      <div id="cfg-probes" class="probe-list"></div>
    </details>

    <details class="field" id="advanced">
      <summary>高级：直接粘贴快照 JSON（整场可填写 RoundSnapshot 数组）</summary>
      <div class="sample-row" id="sample-buttons"></div>
      <textarea id="snapshot-input" rows="8" spellcheck="false"
        placeholder='{"match_id": "...", "round_id": "...", ...}'></textarea>
      <button type="button" id="format-snapshot" class="ghost">格式化并校验 JSON</button>
      <span id="snapshot-note" class="muted"></span>
    </details>

    <div class="field row" id="options-row">
      <label class="check"><input type="checkbox" id="force-demo" hidden>
        强制离线演示（忽略已配置的真实模型）</label>
      <label class="check"><input type="checkbox" id="show-json"> 同时显示原始 JSON</label>
    </div>

    <button id="run-button" class="primary">开始分析</button>
    <div id="client-error" class="error-box" hidden></div>
  </section>

  <section class="panel" id="report-panel">
    <h2>教练报告</h2>
    <div id="match-timeline" hidden></div>
    <div id="report-placeholder" class="placeholder">
      填写左侧输入后点击「开始分析」。没有截图时可以直接从「高级」载入样例快照体验完整流程。
    </div>
    <div id="report-content" hidden></div>
  </section>
</main>

<footer class="muted">离线演示不需要任何模型密钥 · 工具结果中的未知值不会被当作零</footer>
<script src="/static/app.js"></script>
</body>
</html>
